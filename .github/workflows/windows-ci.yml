# Build and test on Windows for every pull request and every push to main.
#
# WinUI 3 compiles its XAML with a Windows-only toolchain, so nothing that touches the app can be checked
# anywhere else. This job is the gate: the docs site must match its markdown sources, the whole solution
# must build, and the full test suite must pass. It then opens every page of the app itself, in both
# themes, and uploads a picture of each.
name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an older run's answer irrelevant.
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (Debug x64)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # docs/build-docs.py renders every docs/*.md into its .html page; --check fails if a page is missing
      # or stale, which is what stops a hand-edited page drifting away from its source.
      - name: Docs site matches its sources
        run: |
          python -m pip install --quiet markdown
          python docs/build-docs.py --check

      # Debug is the unpackaged configuration (SysMonitor.App.csproj), the same build `dotnet run` uses.
      - name: Build
        run: dotnet build SysMonitor.sln -c Debug -p:Platform=x64

      - name: Test
        run: >
          dotnet test tests/SysMonitor.Tests/SysMonitor.Tests.csproj -c Debug -p:Platform=x64
          --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # Opens every page in both themes and saves a picture of each (src/SysMonitor.App/Diagnostics/UiSmokeRun.cs).
      # It fails on what only shows when XAML loads: a parse error, a navigation that fails, a resource that does
      # not resolve. A hosted runner is an unproven place to open a WinUI window, so until this step has passed
      # three runs in a row it reports without failing the job. The report and pictures are uploaded either way.
      - name: UI smoke run
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          # A crash dialog would hold the run open until the timeout.
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name DontShowUI -Value 1

          $exe = Get-ChildItem -Path src/SysMonitor.App/bin/x64/Debug -Recurse -Filter SysMonitor.App.exe |
            Select-Object -First 1
          if (-not $exe) { throw 'SysMonitor.App.exe was not built' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'ui-smoke'

          $app = Start-Process -FilePath $exe.FullName -ArgumentList '--ui-smoke', "`"$out`"" -PassThru
          $null = $app.Handle   # keeps the exit code readable once the process has gone
          if (-not $app.WaitForExit(15 * 60 * 1000)) {
            $app.Kill()
            throw 'The UI smoke run did not finish within 15 minutes'
          }

          $report = Join-Path $out 'report.json'
          if (-not (Test-Path $report)) { throw "The UI smoke run wrote no report (exit code $($app.ExitCode))" }

          $result = Get-Content $report -Raw | ConvertFrom-Json
          "Passed: $($result.passed), finished: $($result.finished), pages: $($result.pages.Count)"
          $result.problems | ForEach-Object { "Problem: $_" }
          $result.pages | Where-Object { $_.problems.Count -gt 0 } |
            ForEach-Object { "$($_.shift) $($_.page): $($_.problems -join ' | ')" }

          # A run that stopped early passes nothing, whatever its exit code says.
          if ($app.ExitCode -ne 0 -or -not $result.finished -or -not $result.passed) {
            throw "The UI smoke run failed (exit code $($app.ExitCode))"
          }

      - name: Upload UI smoke run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: ui-smoke
          if-no-files-found: ignore
